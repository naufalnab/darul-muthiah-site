name: Validate internal MADUM preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:gate
      - run: pnpm run build
        env:
          ASTRO_BASE: /
      - name: Browser QA at root
        run: CHROME_PATH=$(command -v google-chrome) pnpm run test:qa
      - name: Build Pages subpath preview
        run: pnpm run build
        env:
          ASTRO_BASE: /darul-muthiah-site
          GITHUB_PAGES: 'true'
      - name: Browser QA at Pages subpath
        run: CHROME_PATH=$(command -v google-chrome) QA_BASE=/darul-muthiah-site pnpm run test:qa
